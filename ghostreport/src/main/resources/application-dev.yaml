spring:
  sql:
    init:
      mode: always
      platform: postgresql
      schema-locations: classpath:db/schema/postgresql/001_audit_alert_metadata.sql
      separator: "@@"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ghostreport}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false
      path: /h2-console

server:
  error:
    include-stacktrace: never

ghostreport:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-32-chars}
    active-key-id: ${JWT_ACTIVE_KEY_ID:dev-key}
    previous-secrets: ${JWT_PREVIOUS_SECRETS:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:false}
  mfa:
    enabled: ${GHOSTREPORT_MFA_ENABLED:true}
    required-roles: ${GHOSTREPORT_MFA_REQUIRED_ROLES:ADMIN,ANALYST,AUDITOR}
    code-ttl-seconds: ${GHOSTREPORT_MFA_CODE_TTL_SECONDS:300}
    expose-code: ${GHOSTREPORT_MFA_EXPOSE_CODE:true}
  seed-users:
    enabled: ${GHOSTREPORT_SEED_USERS_ENABLED:true}
  backup:
    hmac-secret: ${BACKUP_HMAC_SECRET:dev-only-backup-hmac-secret-32-chars}
    hmac-key-id: ${BACKUP_HMAC_KEY_ID:dev-backup-hmac-v1}

app:
  upload:
    max-files-per-request: ${APP_UPLOAD_MAX_FILES_PER_REQUEST:5}

security:
  rate-limit:
    tracking:
      max-attempts: ${RATE_LIMIT_TRACKING_MAX_ATTEMPTS:10}
      window-seconds: ${RATE_LIMIT_TRACKING_WINDOW_SECONDS:60}
    upload:
      max-attempts: ${RATE_LIMIT_UPLOAD_MAX_ATTEMPTS:10}
      window-seconds: ${RATE_LIMIT_UPLOAD_WINDOW_SECONDS:60}
    download:
      max-attempts: ${RATE_LIMIT_DOWNLOAD_MAX_ATTEMPTS:10}
      window-seconds: ${RATE_LIMIT_DOWNLOAD_WINDOW_SECONDS:60}
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:600}
