<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>GhostReport - Submeter Denúncia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topnav">
    <a class="brand" href="/index.html">GhostReport</a>
    <a href="/submit.html">Submeter denúncia</a>
    <a href="/track.html">Acompanhar denúncia</a>
    <a href="/analyst.html">Painel Analista</a>
    <a href="/auditor.html">Painel Auditor</a>
    <a href="/admin.html">Painel Admin</a>
</div>

<div class="container">
    <h1>Submeter Denúncia</h1>

    <form id="reportForm">

        <label for="title">Título da denúncia</label>
        <input id="title" type="text" required>

        <label for="category">Categoria</label>
        <select id="category" required>
            <option value="">Selecionar categoria</option>
            <option value="Fraud">Fraude</option>
            <option value="Corruption">Corrupção</option>
            <option value="Harassment">Assédio</option>
            <option value="Security">Segurança</option>
            <option value="Other">Outros</option>
        </select>

        <label for="description">Descrição</label>
        <textarea id="description" rows="5" required></textarea>

        <label for="files">Anexos</label>
        <input id="files" type="file" multiple>

        <button id="submitButton" type="submit">Submeter denúncia</button>
    </form>

    <div id="result"></div>
</div>

<script src="/js/dom.js"></script>
<script src="/js/security-support.js"></script>
<script src="/js/api.js"></script>
<script src="/js/submit.js"></script>

</body>
</html>
