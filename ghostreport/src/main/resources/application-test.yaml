spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:ghostreport-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  error:
    include-stacktrace: never

app:
  upload-dir: target/test-uploads/default
  upload:
    max-files-per-request: 5

ghostreport:
  jwt:
    secret: test-only-change-this-secret-32-chars
    active-key-id: test-key
    previous-secrets:
    expiration-seconds: 3600
  mfa:
    enabled: false
    required-roles: ADMIN,ANALYST,AUDITOR
    code-ttl-seconds: 300
    expose-code: true
  seed-users:
    enabled: true
  backup-dir: target/test-backups/default
  backup-enabled: true
  backup:
    hmac-secret: test-only-backup-hmac-secret-32-chars
    hmac-key-id: test-backup-hmac-v1

security:
  rate-limit:
    tracking:
      max-attempts: 10
      window-seconds: 60
    upload:
      max-attempts: 10
      window-seconds: 60
    download:
      max-attempts: 10
      window-seconds: 60
    login:
      max-attempts: 5
      window-seconds: 600
