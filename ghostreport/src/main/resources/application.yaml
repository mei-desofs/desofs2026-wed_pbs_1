spring:
  application:
    name: ghostreport

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      platform: postgresql
      schema-locations: classpath:db/schema/postgresql/001_audit_alert_metadata.sql
      separator: "@@"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}


  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:8KB}
  error:
    include-stacktrace: never
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:30s}
    max-connections: ${SERVER_MAX_CONNECTIONS:200}
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:50}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}

app:
  upload-dir: uploads
  upload:
    max-files-per-request: ${APP_UPLOAD_MAX_FILES_PER_REQUEST:5}

ghostreport:
  jwt:
    secret: ${JWT_SECRET}
    active-key-id: ${JWT_ACTIVE_KEY_ID:primary}
    previous-secrets: ${JWT_PREVIOUS_SECRETS:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    expose-token: false
  mfa:
    enabled: ${GHOSTREPORT_MFA_ENABLED:true}
    required-roles: ${GHOSTREPORT_MFA_REQUIRED_ROLES:ADMIN,ANALYST,AUDITOR}
    code-ttl-seconds: ${GHOSTREPORT_MFA_CODE_TTL_SECONDS:300}
    max-attempts: ${GHOSTREPORT_MFA_MAX_ATTEMPTS:5}
    expose-code: false
  seed-users:
    enabled: false
  backup-dir: backups
  backup-enabled: true
  backup-schedule-cron: "0 0 2 * * *"
  backup:
    hmac-secret: ${BACKUP_HMAC_SECRET}
    hmac-key-id: ${BACKUP_HMAC_KEY_ID:backup-hmac-v1}

security:
  rate-limit:
    tracking:
      max-attempts: 10
      window-seconds: 60
    report:
      max-attempts: ${RATE_LIMIT_REPORT_MAX_ATTEMPTS:10}
      window-seconds: ${RATE_LIMIT_REPORT_WINDOW_SECONDS:60}
    upload:
      max-attempts: 10
      window-seconds: 60
    download:
      max-attempts: 10
      window-seconds: 60
    login:
      max-attempts: 5
      window-seconds: 600
