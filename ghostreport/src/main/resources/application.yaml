spring:
  application:
    name: ghostreport

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081
  error:
    include-stacktrace: never

app:
  upload-dir: uploads
  upload:
    max-files-per-request: ${APP_UPLOAD_MAX_FILES_PER_REQUEST:5}

ghostreport:
  jwt:
    secret: ${JWT_SECRET}
    active-key-id: ${JWT_ACTIVE_KEY_ID:primary}
    previous-secrets: ${JWT_PREVIOUS_SECRETS:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    expose-token: false
  seed-users:
    enabled: false
  backup-dir: backups
  backup-enabled: true
  backup-schedule-cron: "0 0 2 * * *"

security:
  rate-limit:
    tracking:
      max-attempts: 10
      window-seconds: 60
    upload:
      max-attempts: 10
      window-seconds: 60
    download:
      max-attempts: 10
      window-seconds: 60
    login:
      max-attempts: 5
      window-seconds: 600
