services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ghostreport
      POSTGRES_USER: ghostreport_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - ghostreport-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostreport_app -d ghostreport"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghostreport:
    build:
      context: ./ghostreport
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/ghostreport
      DB_USERNAME: ghostreport_app
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-local-key}
      JWT_PREVIOUS_SECRETS: ${JWT_PREVIOUS_SECRETS:-}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      APP_UPLOAD_MAX_FILES_PER_REQUEST: ${APP_UPLOAD_MAX_FILES_PER_REQUEST:-5}
      GHOSTREPORT_SEED_USERS_ENABLED: "false"
    ports:
      - "8081:8081"
    volumes:
      - ghostreport-uploads:/opt/ghostreport/uploads
      - ghostreport-backups:/opt/ghostreport/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  ghostreport-postgres-data:
  ghostreport-uploads:
  ghostreport-backups:
