# DevSecOps stage 00.
# Fast independent check: scans the repository before deeper build/security
# validation. A real secret finding should be treated as blocking.
name: 00 - Secret Scanning Gitleaks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: secret-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scanning-gitleaks:
    name: Detect hardcoded secrets
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # The scan covers the whole repository root, not only the Spring Boot
      # module, because secrets can appear in docs, workflows or scripts too.
      - name: Run Gitleaks secret scan
        run: |
          mkdir -p target/gitleaks
          docker run --rm \
            -v "$PWD/..:/repo:ro" \
            -v "$PWD/target/gitleaks:/reports:rw" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir /repo \
            --config /repo/.gitleaks.toml \
            --report-format json \
            --report-path /reports/gitleaks-report.json \
            --redact

      - name: Upload Gitleaks secret scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-gitleaks-json
          path: ghostreport/target/gitleaks/**
          if-no-files-found: warn

      - name: Publish secret scanning evidence summary
        if: always()
        run: |
          {
            echo "## Secret Scanning"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| Gitleaks JSON report | secret-scan-gitleaks-json |"
            echo ""
            echo "An empty JSON array means no hardcoded secrets were found in the scanned repository content."
          } >> "$GITHUB_STEP_SUMMARY"
