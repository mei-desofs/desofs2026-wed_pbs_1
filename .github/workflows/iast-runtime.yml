# DevSecOps stage 04.
# Runtime security evidence workflow: executes security-focused integration
# tests and prepares optional Contrast Java agent evidence for IAST-compatible
# assessment when credentials are configured in the repository.
name: 04 - IAST Runtime Security Evidence

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: iast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage_04_iast_runtime_security:
    name: Stage 04 - Runtime security tests and IAST evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Prepare Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Run runtime security-focused automated tests
        run: |
          mkdir -p target/iast-evidence
          ./mvnw \
            -Dtest=RuntimeSecurityEventLoggingTest,ErrorHandlingSecurityTest,SecurityHeadersTest,JwtServiceSecurityTest,LoginRateLimitSecurityTest \
            test

      - name: Prepare optional Contrast Java agent integration evidence
        run: |
          mkdir -p target/iast-evidence
          {
            echo "# IAST Runtime Security Evidence"
            echo ""
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Runtime security tests"
            echo ""
            echo "Executed security-focused tests for authentication events, JWT validation, rate limiting, security headers and error handling."
            echo ""
            echo "## IAST agent integration"
            echo ""
            if [ -n "${CONTRAST_AGENT_VERSION:-}" ] && \
               [ -n "${CONTRAST__API__URL:-}" ] && \
               [ -n "${CONTRAST__API__API_KEY:-}" ] && \
               [ -n "${CONTRAST__API__SERVICE_KEY:-}" ] && \
               [ -n "${CONTRAST__API__USER_NAME:-}" ]; then
              echo "Contrast Java agent configuration variables are present."
              echo "The project is ready to execute an instrumented Spring Boot runtime with the Contrast Java agent."
            else
              echo "Contrast Java agent configuration variables are not present in this run."
              echo "The workflow still produces local runtime security evidence from automated tests."
              echo "To enable external IAST telemetry, configure CONTRAST_AGENT_VERSION, CONTRAST__API__URL, CONTRAST__API__API_KEY, CONTRAST__API__SERVICE_KEY and CONTRAST__API__USER_NAME as GitHub Actions variables/secrets."
            fi
          } > target/iast-evidence/iast-runtime-evidence.md
        env:
          CONTRAST_AGENT_VERSION: ${{ vars.CONTRAST_AGENT_VERSION }}
          CONTRAST__API__URL: ${{ vars.CONTRAST__API__URL }}
          CONTRAST__API__API_KEY: ${{ secrets.CONTRAST__API__API_KEY }}
          CONTRAST__API__SERVICE_KEY: ${{ secrets.CONTRAST__API__SERVICE_KEY }}
          CONTRAST__API__USER_NAME: ${{ secrets.CONTRAST__API__USER_NAME }}

      - name: Upload IAST runtime security evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iast-runtime-security-evidence
          path: |
            ghostreport/target/iast-evidence/**
            ghostreport/target/surefire-reports/**
          if-no-files-found: warn

      - name: Publish IAST evidence summary
        if: always()
        run: |
          {
            echo "## IAST / Runtime Security Evidence"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| Runtime security-focused tests | iast-runtime-security-evidence |"
            echo "| Optional Contrast Java agent readiness notes | iast-runtime-security-evidence |"
            echo "| Gate mode | Evidence review |"
          } >> "$GITHUB_STEP_SUMMARY"
