# DevSecOps stage 05.
# Test quality workflow: mutation testing gives stronger evidence than line coverage alone.
name: 05 - Mutation Testing PIT

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: pit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage_05_mutation_testing:
    name: Stage 05 - PIT mutation testing evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Prepare Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Run PIT mutation testing in evidence review mode
        run: |
          mkdir -p target/pit-reports
          set +e
          ./mvnw \
            -Djacoco.skip=true \
            -DskipTests=false \
            org.pitest:pitest-maven:mutationCoverage
          pit_exit_code=$?
          set -e

          echo "$pit_exit_code" > target/pit-reports/pit-exit-code.txt
          {
            echo "# PIT Mutation Testing Evidence"
            echo ""
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "PIT command exit code: $pit_exit_code"
            echo ""
            if find target/pit-reports -type f \( -name "index.html" -o -name "mutations.xml" -o -name "*.html" \) -print -quit | grep -q .; then
              echo "PIT report files were generated under target/pit-reports."
            else
              echo "No PIT HTML/XML report files were generated. Review the workflow logs and pit-exit-code.txt."
            fi
            echo ""
            echo "Gate mode: evidence review. Mutation findings and thresholds are reviewed manually for Sprint 2 evidence and do not block the whole pipeline."
          } > target/pit-reports/pit-evidence-summary.md

          if [ "$pit_exit_code" -ne 0 ]; then
            echo "::warning title=PIT evidence review::PIT exited with code $pit_exit_code. Evidence artifact was still generated for triage."
          fi
        continue-on-error: true

      - name: Upload PIT mutation testing report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-mutation-testing-report
          path: ghostreport/target/pit-reports/**
          if-no-files-found: error

      - name: Publish PIT evidence summary
        if: always()
        run: |
          {
            echo "## Mutation Testing - PIT"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| PIT mutation testing report | pit-mutation-testing-report |"
            echo "| Gate mode | Evidence review |"
            echo ""
            echo "PIT is used to assess test strength beyond JaCoCo line coverage. If the PIT command exits non-zero, the exit code and triage note are preserved inside the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
