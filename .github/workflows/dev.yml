name: dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test / build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ghostreport
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v6

      - name: Prepare Java 17 and Maven dependency cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Run automated tests and enforce JaCoCo coverage
        run: ./mvnw verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ghostreport
          DB_USERNAME: postgres
          DB_PASSWORD: user

      - name: Upload Surefire test report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-surefire-test-reports
          path: ghostreport/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload JaCoCo coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-jacoco-coverage-report
          path: |
            ghostreport/target/site/jacoco/**
            ghostreport/target/jacoco.exec
          if-no-files-found: warn

      - name: Publish build and test evidence summary
        if: always()
        run: |
          {
            echo "## Build, Tests and Coverage"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| Maven verify test results | ci-surefire-test-reports |"
            echo "| JaCoCo report and coverage check | ci-jacoco-coverage-report |"
            echo "| PIT mutation testing | Dedicated pit-mutation-testing workflow |"
            echo "| Gate mode | Blocking for compile/tests/coverage |"
          } >> "$GITHUB_STEP_SUMMARY"

  security-secrets:
    name: security-secrets / secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v6

      - name: Run Gitleaks repository secret scan
        run: |
          mkdir -p target/gitleaks
          set +e
          docker run --rm \
            -v "$PWD/..:/repo:ro" \
            -v "$PWD/target/gitleaks:/reports:rw" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir /repo \
            --config /repo/.gitleaks.toml \
            --report-format json \
            --report-path /reports/gitleaks-report.json \
            --redact
          scan_exit=$?
          set -e

          if [ -f target/gitleaks/gitleaks-report.json ]; then
            echo "Redacted Gitleaks report:"
            cat target/gitleaks/gitleaks-report.json
          else
            echo "No Gitleaks report was generated."
          fi

          exit "$scan_exit"

      - name: Upload Gitleaks JSON evidence artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: secret-scan-gitleaks-json
          path: ghostreport/target/gitleaks/**
          if-no-files-found: warn

      - name: Publish secret scanning evidence summary
        if: always()
        run: |
          {
            echo "## Secret Scanning"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| Gitleaks JSON report | secret-scan-gitleaks-json |"
            echo "| Gate mode | Blocking for confirmed leaks |"
          } >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: sast / SonarCloud SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-test, security-secrets]

    permissions:
      contents: read
      security-events: write
      actions: read

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Java 17 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Initialize CodeQL for Java
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Build GhostReport for SAST analysis
        run: ./mvnw -DskipTests clean compile

      - name: Run SpotBugs static analysis in evidence mode
        run: ./mvnw -DskipTests compile com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs -Dspotbugs.xmlOutput=true

      - name: Build and analyze with SonarCloud
        run: |
          mkdir -p target/sast-evidence
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SonarCloud scan failed because SONAR_TOKEN is not configured." > target/sast-evidence/sonarcloud-summary.txt
            exit 1
          fi

          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY:-mei-desofs-ghostreport1_ghostreport}" \
            -Dsonar.organization="${SONAR_ORGANIZATION:-mei-desofs-ghostreport1}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

          {
            echo "SonarCloud scan executed."
            echo "Project key: ${SONAR_PROJECT_KEY:-mei-desofs-ghostreport1_ghostreport}"
            echo "Organization: ${SONAR_ORGANIZATION:-mei-desofs-ghostreport1}"
          } > target/sast-evidence/sonarcloud-summary.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4

      - name: Prepare SAST archiveable evidence summary
        if: always()
        run: |
          mkdir -p target/sast-evidence
          {
            echo "# SAST Evidence"
            echo ""
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "CodeQL results are uploaded to GitHub Code Scanning."
            echo "SpotBugs XML and SonarCloud run notes are uploaded as artifacts."
          } > target/sast-evidence/sast-evidence-summary.md

      - name: Upload SAST evidence artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sast-reports
          path: |
            ghostreport/target/spotbugsXml.xml
            ghostreport/target/*spotbugs*.xml
            ghostreport/target/site/spotbugs*
            ghostreport/target/sast-evidence/**
          if-no-files-found: warn

      - name: Publish SAST evidence summary
        if: always()
        run: |
          {
            echo "## SAST"
            echo ""
            echo "| Evidence | Location |"
            echo "| --- | --- |"
            echo "| CodeQL semantic analysis | GitHub Code Scanning alerts |"
            echo "| SpotBugs XML/static analysis report | sast-reports |"
            echo "| SonarCloud execution notes | sast-reports |"
            echo "| Gate mode | Evidence review; SonarCloud fails when SONAR_TOKEN is missing or analysis fails |"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-scanning:
    name: dependency-scanning / Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build-test, security-secrets]

    permissions:
      contents: read
      security-events: write
      actions: read

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v6

      - name: Prepare Java 17 and Maven dependency cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Run OWASP Dependency-Check SCA in evidence mode
        run: ./mvnw org.owasp:dependency-check-maven:12.1.0:check -Dformat=ALL -DossindexAnalyzerEnabled=false -DfailOnError=false -DfailBuildOnCVSS=11
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Detect Dependency-Check SARIF report
        id: dependency_check_sarif
        run: |
          if [ -f target/dependency-check-report/dependency-check-report.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Dependency-Check SARIF to code scanning
        if: steps.dependency_check_sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ghostreport/target/dependency-check-report/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Generate CycloneDX SBOM
        run: ./mvnw -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Upload Dependency-Check SCA reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-sca-reports
          path: ghostreport/target/dependency-check-report/**
          if-no-files-found: warn

      - name: Upload CycloneDX SBOM artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-cyclonedx
          path: |
            ghostreport/target/bom.json
            ghostreport/target/bom.xml
          if-no-files-found: warn

      - name: Publish dependency scanning evidence summary
        if: always()
        run: |
          {
            echo "## Dependency Scanning"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| Dependency-Check HTML/XML/JSON/SARIF reports | dependency-check-sca-reports |"
            echo "| Dependency-Check SARIF | GitHub Code Scanning when generated |"
            echo "| CycloneDX JSON/XML SBOM | sbom-cyclonedx |"
            echo "| Gate mode | Evidence review |"
          } >> "$GITHUB_STEP_SUMMARY"

  dast-scan:
    name: dast-scan / dast-scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [build-test, security-secrets]

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ghostreport
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v6

      - name: Prepare Java 17 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Run runtime security-focused automated tests
        run: |
          mkdir -p target/iast-evidence
          ./mvnw \
            -Djacoco.skip=true \
            -Dtest=RuntimeSecurityEventLoggingTest,ErrorHandlingSecurityTest,SecurityHeadersTest,JwtServiceSecurityTest,LoginRateLimitSecurityTest,CsrfSecurityTest,PublicReportFlowIntegrationTest,ReportControllerAttachmentUploadTest,RbacAuthorizationMatrixTest,AdminMfaAuthenticationTest,AuditorAuthorizationTest,AdminBackupControllerSecurityTest,BackupServiceIntegrationTest,ApiValidationContractTest \
            test

      - name: Build GhostReport executable JAR for DAST and runtime security testing
        run: ./mvnw -DskipTests package

      - name: Start GhostReport on the runner at localhost:8081
        run: |
          mkdir -p target/zap-reports
          mkdir -p target/iast-evidence
          chmod 777 target/zap-reports
          nohup java \
            -jar target/ghostreport-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=dev \
            > target/ghostreport-dast-app.log 2>&1 &
          echo $! > target/ghostreport-dast-app.pid
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ghostreport
          DB_USERNAME: postgres
          DB_PASSWORD: user

      - name: Wait until GhostReport is ready for scanning
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8081/index.html > /dev/null; then
              echo "GhostReport is ready for DAST"
              exit 0
            fi
            sleep 2
          done

          echo "GhostReport did not become ready"
          cat target/ghostreport-dast-app.log
          exit 1

      - name: Exercise runtime security endpoints for evidence
        run: |
          mkdir -p target/iast-evidence
          cookie_jar="target/iast-evidence/runtime-cookies.txt"

          curl --silent --show-error --cookie-jar "$cookie_jar" http://localhost:8081/index.html > /dev/null || true
          csrf_token="$(awk '$6 == "XSRF-TOKEN" { print $7 }' "$cookie_jar" | tail -1)"
          csrf_header=()
          if [ -n "$csrf_token" ]; then
            csrf_header=(-H "X-XSRF-TOKEN: $csrf_token")
          fi

          post_json_status() {
            local payload="$1"
            local url="$2"
            local output="$3"
            curl --silent --show-error \
              --cookie "$cookie_jar" \
              --cookie-jar "$cookie_jar" \
              "${csrf_header[@]}" \
              --output "$output" \
              --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$url" || true
          }

          post_multipart_status() {
            local url="$1"
            local output="$2"
            shift 2
            curl --silent --show-error \
              --cookie "$cookie_jar" \
              --cookie-jar "$cookie_jar" \
              "${csrf_header[@]}" \
              --output "$output" \
              --write-out '%{http_code}' \
              "$@" \
              "$url" || true
          }

          login_payload='{"username":"ci-runtime-probe","password":"invalid-password"}'
          failed_login_status="$(post_json_status "$login_payload" http://localhost:8081/auth/login target/iast-evidence/failed-login-response.json)"

          rate_limit_status="not exercised"
          for attempt in 1 2 3 4 5 6; do
            rate_limit_status="$(post_json_status "$login_payload" http://localhost:8081/auth/login target/iast-evidence/rate-limit-response.json)"
          done

          valid_report_payload='{"title":"Runtime probe report","description":"Runtime security probe with valid input for GhostReport evidence.","category":"Ethics"}'
          valid_report_status="$(post_json_status "$valid_report_payload" http://localhost:8081/reports target/iast-evidence/report-valid-response.json)"
          report_id="$(python -c "import json,pathlib; p=pathlib.Path('target/iast-evidence/report-valid-response.json'); print(json.loads(p.read_text()).get('id','') if p.exists() and p.read_text().strip() else '')" 2>/dev/null || echo '')"
          tracking_code="$(python -c "import json,pathlib; p=pathlib.Path('target/iast-evidence/report-valid-response.json'); print(json.loads(p.read_text()).get('trackingCode','') if p.exists() and p.read_text().strip() else '')" 2>/dev/null || echo '')"

          invalid_report_status="$(post_json_status '{"title":"","description":"short","category":""}' http://localhost:8081/reports target/iast-evidence/report-invalid-response.json)"
          dangerous_report_status="$(post_json_status '{"title":"<script>alert(1)</script>","description":"Runtime probe with <img src=x onerror=alert(1)> characters that must be treated as text.","category":"Ethics"}' http://localhost:8081/reports target/iast-evidence/report-dangerous-response.json)"
          mass_assignment_status="$(post_json_status '{"title":"Mass assignment probe","description":"Runtime probe trying to set fields that should be ignored by DTO binding.","category":"Ethics","role":"ADMIN","status":"RESOLVED","id":9999,"trackingCode":"FORCED-CODE"}' http://localhost:8081/reports target/iast-evidence/report-mass-assignment-response.json)"

          valid_tracking_status="not exercised"
          if [ -n "$tracking_code" ]; then
            valid_tracking_status="$(post_json_status "{\"trackingCode\":\"$tracking_code\"}" http://localhost:8081/reports/verify target/iast-evidence/tracking-valid-response.json)"
          fi

          invalid_tracking_status="$(post_json_status '{"trackingCode":"INVALID-CODE"}' http://localhost:8081/reports/verify target/iast-evidence/tracking-invalid-response.json)"
          repeated_tracking_status="not exercised"
          for attempt in 1 2 3 4 5 6; do
            repeated_tracking_status="$(post_json_status '{"trackingCode":"INVALID-CODE"}' http://localhost:8081/reports/verify target/iast-evidence/tracking-repeated-response.json)"
          done

          allowed_upload_status="not exercised"
          blocked_extension_status="not exercised"
          suspicious_content_status="not exercised"
          traversal_filename_status="not exercised"
          max_size_status="covered by automated tests"
          zip_slip_status="covered by backup/package tests"
          if [ -n "$report_id" ] && [ -n "$tracking_code" ]; then
            printf '%%PDF-1.4\n%% Runtime probe PDF content\n' > target/iast-evidence/runtime-allowed.pdf
            printf 'MZ suspicious executable content\n' > target/iast-evidence/runtime-blocked.exe
            printf 'not really a pdf\n' > target/iast-evidence/runtime-fake.pdf
            printf 'Traversal probe content\n' > target/iast-evidence/runtime-traversal.txt

            allowed_upload_status="$(post_multipart_status "http://localhost:8081/reports/${report_id}/attachments" target/iast-evidence/upload-allowed-response.json \
              -F "trackingCode=$tracking_code" \
              -F "files=@target/iast-evidence/runtime-allowed.pdf;type=application/pdf")"
            blocked_extension_status="$(post_multipart_status "http://localhost:8081/reports/${report_id}/attachments" target/iast-evidence/upload-blocked-extension-response.json \
              -F "trackingCode=$tracking_code" \
              -F "files=@target/iast-evidence/runtime-blocked.exe;type=application/octet-stream")"
            suspicious_content_status="$(post_multipart_status "http://localhost:8081/reports/${report_id}/attachments" target/iast-evidence/upload-suspicious-content-response.json \
              -F "trackingCode=$tracking_code" \
              -F "files=@target/iast-evidence/runtime-fake.pdf;type=application/pdf")"
            traversal_filename_status="$(post_multipart_status "http://localhost:8081/reports/${report_id}/attachments" target/iast-evidence/upload-traversal-response.json \
              -F "trackingCode=$tracking_code" \
              -F "files=@target/iast-evidence/runtime-traversal.txt;filename=../runtime-traversal.txt;type=text/plain")"
          fi

          {
            echo "| Endpoint/probe | Purpose | HTTP status / result |"
            echo "| --- | --- | --- |"
            for item in \
              "GET /index.html|Public frontend and security headers|http://localhost:8081/index.html" \
              "GET /login.html|Unauthenticated login page request|http://localhost:8081/login.html" \
              "GET /admin/users|Protected admin endpoint without token|http://localhost:8081/admin/users"
            do
              method_and_path="${item%%|*}"
              rest="${item#*|}"
              purpose="${rest%%|*}"
              url="${rest#*|}"
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url" || true)"
              echo "| $method_and_path | $purpose | $status |"
            done

            invalid_jwt_status="$(python -c "import http.client; conn = http.client.HTTPConnection('localhost', 8081, timeout=10); conn.request('GET', '/admin/users', headers={'Authorization': 'Bearer invalid-ci-runtime-token'}); print(conn.getresponse().status)" 2>/dev/null || echo 000)"
            csrf_rejection_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data '{"currentPassword":"old-password","newPassword":"new-password"}' \
              http://localhost:8081/auth/password/change || true)"

            echo "| GET /admin/users | Protected endpoint with invalid JWT | $invalid_jwt_status |"
            echo "| POST /auth/login | Failed login attempt with invalid credentials | $failed_login_status |"
            echo "| POST /auth/login | Repeated failed login attempts for rate-limit/brute-force evidence | $rate_limit_status |"
            echo "| POST /auth/password/change | CSRF rejection on protected state-changing endpoint without CSRF token | $csrf_rejection_status |"
            echo "| POST /reports | Valid anonymous report creation | $valid_report_status |"
            echo "| POST /reports | Invalid report validation | $invalid_report_status |"
            echo "| POST /reports | Dangerous characters rendered/handled as data | $dangerous_report_status |"
            echo "| POST /reports | Mass-assignment attempt through extra JSON fields | $mass_assignment_status |"
            echo "| POST /reports/verify | Valid tracking code verification | $valid_tracking_status |"
            echo "| POST /reports/verify | Invalid tracking code verification | $invalid_tracking_status |"
            echo "| POST /reports/verify | Repeated invalid tracking attempts | $repeated_tracking_status |"
            echo "| POST /reports/{id}/attachments | Allowed upload probe | $allowed_upload_status |"
            echo "| POST /reports/{id}/attachments | Blocked extension upload probe | $blocked_extension_status |"
            echo "| POST /reports/{id}/attachments | Suspicious content-type/signature upload probe | $suspicious_content_status |"
            echo "| POST /reports/{id}/attachments | Path traversal filename upload probe | $traversal_filename_status |"
            echo "| Upload max size | Maximum size validation | $max_size_status |"
            echo "| ZIP Slip | ZIP traversal validation | $zip_slip_status |"
          } > target/iast-evidence/runtime-endpoints.md

      - name: Check runtime logs for sensitive evidence leakage
        if: always()
        run: |
          mkdir -p target/iast-evidence
          {
            echo "| Check | Result |"
            echo "| --- | --- |"
            if [ ! -s target/ghostreport-dast-app.log ]; then
              echo "| Application log exists | Not generated |"
              exit 0
            fi

            echo "| Application log exists | Generated |"

            if grep -Eiq 'password=|password:|Authorization:|Bearer [A-Za-z0-9._-]+|JWT_SECRET|BACKUP_HMAC_SECRET|stacktrace|java\.[a-zA-Z.]+Exception:' target/ghostreport-dast-app.log; then
              echo "| Sensitive-pattern scan | Review required: potential sensitive or stack-trace pattern found |"
              grep -Ein 'password=|password:|Authorization:|Bearer [A-Za-z0-9._-]+|JWT_SECRET|BACKUP_HMAC_SECRET|stacktrace|java\.[a-zA-Z.]+Exception:' target/ghostreport-dast-app.log \
                | sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
                | head -20 > target/iast-evidence/runtime-log-sensitive-findings.txt
            else
              echo "| Sensitive-pattern scan | No obvious passwords, bearer tokens, secret names or stack traces found |"
            fi
          } > target/iast-evidence/runtime-log-sanitization.md

      - name: Run OWASP ZAP Docker baseline scan in evidence mode
        run: |
          docker run --rm --network host \
            --user root \
            -w /zap/wrk \
            -v "$PWD/target/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8081 \
              -r zap-baseline.html \
              -x zap-baseline.xml \
              -J zap-baseline.json \
              -I
        continue-on-error: true

      - name: Prepare runtime security and IAST evidence summary
        if: always()
        run: |
          zap_result="not generated"
          if [ -s target/zap-reports/zap-baseline.json ]; then
            zap_result="generated: target/zap-reports/zap-baseline.json"
          elif [ -s target/zap-reports/zap-baseline.html ]; then
            zap_result="generated: target/zap-reports/zap-baseline.html"
          fi

          app_state="not confirmed"
          if curl --fail --silent --show-error http://localhost:8081/index.html > /dev/null; then
            app_state="running on http://localhost:8081"
          fi

          {
            echo "# Runtime Security Evidence and IAST-like Testing"
            echo ""
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "This artifact provides academic runtime security testing evidence. It does not claim agent-based IAST."
            echo ""
            echo "## Evidence Classification"
            echo ""
            echo "| Evidence type | What this run provides | Claim boundary |"
            echo "| --- | --- | --- |"
            echo "| Agent-based IAST | Not present | No JVM agent, taint tracking or source-to-sink telemetry is claimed. |"
            echo "| Runtime security testing | Spring Boot security tests, live endpoint probes and application logs | Validates implemented controls at runtime. |"
            echo "| DAST baseline/passive testing | OWASP ZAP baseline against http://localhost:8081 | Evidence review only; unauthenticated baseline. |"
            echo "| IAST-like academic evidence | Correlates runtime tests, live HTTP probes, logs and ZAP evidence | Defensible academic substitute, not commercial IAST. |"
            echo ""
            echo "## Application Runtime"
            echo ""
            echo "Application state: $app_state"
            echo "Runtime: packaged Spring Boot JAR with dev profile and PostgreSQL service."
            echo ""
            echo "## Security-focused Runtime Tests"
            echo ""
            echo "Executed Maven tests:"
            echo ""
            echo "- RuntimeSecurityEventLoggingTest"
            echo "- ErrorHandlingSecurityTest"
            echo "- SecurityHeadersTest"
            echo "- JwtServiceSecurityTest"
            echo "- LoginRateLimitSecurityTest"
            echo "- CsrfSecurityTest"
            echo "- PublicReportFlowIntegrationTest"
            echo "- ReportControllerAttachmentUploadTest"
            echo "- RbacAuthorizationMatrixTest"
            echo "- AdminMfaAuthenticationTest"
            echo "- AuditorAuthorizationTest"
            echo "- AdminBackupControllerSecurityTest"
            echo "- BackupServiceIntegrationTest"
            echo "- ApiValidationContractTest"
            echo ""
            echo "Validated controls:"
            echo ""
            echo "- authentication success/failure audit events;"
            echo "- invalid/expired JWT handling and alerting;"
            echo "- MFA challenge, invalid code rejection and valid verification for internal roles;"
            echo "- public report creation, invalid input and dangerous-character handling;"
            echo "- tracking-code verification and repeated invalid tracking attempts;"
            echo "- upload allow/block decisions for extension, content signature and path traversal;"
            echo "- RBAC for admin, analyst and auditor endpoint groups;"
            echo "- backup creation, verification, tampering detection and path rejection;"
            echo "- login rate limiting and brute-force detection;"
            echo "- CSRF rejection/acceptance behaviour;"
            echo "- browser security headers, including CSP;"
            echo "- generic error handling without stack traces;"
            echo "- security log sanitization for sensitive values."
            echo ""
            echo "Surefire reports are uploaded in this artifact and remain available even when a selected runtime test fails."
            echo ""
            echo "## Endpoints Exercised"
            echo ""
            if [ -s target/iast-evidence/runtime-endpoints.md ]; then
              cat target/iast-evidence/runtime-endpoints.md
            else
              echo "Endpoint smoke evidence was not generated."
            fi
            echo ""
            echo "## DAST Runtime Traffic"
            echo ""
            echo "ZAP baseline target: http://localhost:8081"
            echo "ZAP result: $zap_result"
            echo "ZAP mode: baseline/passive evidence review, not authenticated active exploitation."
            echo ""
            echo "## Runtime Logs"
            echo ""
            echo "Application log artifact: target/ghostreport-dast-app.log"
            echo "Surefire reports artifact: target/surefire-reports"
            echo ""
            if [ -s target/iast-evidence/runtime-log-sanitization.md ]; then
              cat target/iast-evidence/runtime-log-sanitization.md
            else
              echo "Runtime log sanitization evidence was not generated."
            fi
            echo ""
            echo "## Limitations"
            echo ""
            echo "- No JVM IAST agent or taint-tracking sensor is attached."
            echo "- The evidence is IAST-like runtime security testing, not full commercial IAST."
            echo "- ZAP baseline is unauthenticated and does not cover all protected workflows."
            echo "- CSRF acceptance is validated by CsrfSecurityTest; live unauthenticated probes only evidence rejection."
            echo "- Findings must be interpreted together with SAST, SCA, SBOM and DAST evidence."
          } > target/iast-evidence/iast-runtime-evidence.md

      - name: Upload runtime security and IAST-like evidence artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iast-runtime-security-evidence
          path: |
            ghostreport/target/iast-evidence/**
            ghostreport/target/surefire-reports/**
            ghostreport/target/ghostreport-dast-app.log
          if-no-files-found: warn

      - name: Upload OWASP ZAP DAST evidence artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dast-zap-baseline-reports
          path: |
            ghostreport/target/zap-reports/**
            ghostreport/target/ghostreport-dast-app.log
          if-no-files-found: warn

      - name: Publish DAST evidence summary
        if: always()
        run: |
          {
            echo "## DAST and Runtime Security"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| Runtime security-focused tests and IAST-like evidence | iast-runtime-security-evidence |"
            echo "| ZAP HTML/XML/JSON reports and application log | dast-zap-baseline-reports |"
            echo "| Gate mode | Runtime security tests blocking; ZAP evidence review |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop GhostReport background process
        if: always()
        run: |
          if [ -f target/ghostreport-dast-app.pid ]; then
            kill "$(cat target/ghostreport-dast-app.pid)" || true
          fi

