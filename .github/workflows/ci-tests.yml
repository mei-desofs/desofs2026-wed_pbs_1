# DevSecOps stage 01.
# Blocking workflow: the application must compile and tests must pass before
# SAST, SCA and DAST evidence is considered meaningful.
name: 01 - CI Build, Tests and Coverage

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-test-and-coverage:
    name: Compile, test and publish coverage evidence
    runs-on: ubuntu-latest

    # PostgreSQL mirrors the database used by the application more closely than
    # an in-memory test database and gives the CI tests more realistic coverage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ghostreport
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Compile Spring Boot application
        run: ./mvnw clean compile

      - name: Run automated tests and generate JaCoCo coverage
        run: ./mvnw test jacoco:report
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ghostreport
          DB_USERNAME: postgres
          DB_PASSWORD: user

      - name: Upload Surefire test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-surefire-test-reports
          path: ghostreport/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-jacoco-coverage-report
          path: |
            ghostreport/target/site/jacoco/**
            ghostreport/target/jacoco.exec
          if-no-files-found: warn

      - name: Publish CI evidence summary
        if: always()
        run: |
          {
            echo "## CI Build, Tests and Coverage"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| Maven test results | ci-surefire-test-reports |"
            echo "| JaCoCo coverage | ci-jacoco-coverage-report |"
            echo ""
            echo "This is the blocking baseline workflow for the DevSecOps validation flow."
          } >> "$GITHUB_STEP_SUMMARY"
