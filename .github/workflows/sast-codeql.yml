# DevSecOps stage 02C.
# Additional SAST workflow: CodeQL complements SpotBugs with semantic analysis.
name: 02C - SAST CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage_02c_sast_codeql:
    name: Stage 02C - CodeQL semantic SAST evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Prepare Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Initialize CodeQL for Java
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build GhostReport for CodeQL database
        run: ./mvnw -DskipTests clean compile

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4

      - name: Prepare CodeQL archiveable evidence summary
        if: always()
        run: |
          mkdir -p target/codeql-evidence
          {
            echo "# CodeQL SAST Evidence"
            echo ""
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Code Scanning: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/security/code-scanning"
            echo ""
            echo "Primary evidence: GitHub Code Scanning alerts produced by the CodeQL action."
            echo "Archive evidence: this summary records the run context for audit/demo material."
            echo ""
            echo "Gate mode: evidence review."
          } > target/codeql-evidence/codeql-evidence-summary.md

      - name: Upload CodeQL archiveable evidence summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-codeql-evidence-summary
          path: ghostreport/target/codeql-evidence/**
          if-no-files-found: error

      - name: Publish CodeQL evidence summary
        if: always()
        run: |
          {
            echo "## SAST - CodeQL"
            echo ""
            echo "| Evidence | Location |"
            echo "| --- | --- |"
            echo "| CodeQL semantic analysis | GitHub Code Scanning alerts |"
            echo "| Archiveable run summary | sast-codeql-evidence-summary |"
            echo "| Gate mode | Evidence review |"
            echo ""
            echo "CodeQL complements SpotBugs by identifying semantic vulnerability patterns. Code Scanning remains the primary evidence source; the artifact is a run-context summary for local archive/demo."
          } >> "$GITHUB_STEP_SUMMARY"
