# DevSecOps stage 03.
# Runtime evidence workflow: starts GhostReport on the runner and scans it with
# OWASP ZAP in Docker. The scan is passive/baseline and unauthenticated.
name: 03 - DAST OWASP ZAP Baseline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, admin ]
  pull_request:
    branches: [ main, develop, admin ]

permissions:
  contents: read

concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast-zap-baseline:
    name: Baseline dynamic analysis
    runs-on: ubuntu-latest

    # The application is started directly on the GitHub runner and ZAP runs in a
    # Docker container using host networking, scanning http://localhost:8081.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ghostreport
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Start GhostReport on localhost:8081 for DAST
        run: |
          mkdir -p target/zap-reports
          chmod 777 target/zap-reports
          nohup ./mvnw spring-boot:run \
            -Dspring-boot.run.profiles=dev \
            > target/ghostreport-dast-app.log 2>&1 &
          echo $! > target/ghostreport-dast-app.pid
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ghostreport
          DB_USERNAME: postgres
          DB_PASSWORD: user
          JWT_SECRET: dast-only-change-this-secret-32-chars

      - name: Wait for GhostReport readiness
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8081/index.html > /dev/null; then
              echo "GhostReport is ready for DAST"
              exit 0
            fi
            sleep 2
          done

          echo "GhostReport did not become ready"
          cat target/ghostreport-dast-app.log
          exit 1

      # Baseline/passive DAST is intentionally non-intrusive and unauthenticated.
      # The workflow fails if ZAP detects blocking baseline findings.
      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm --network host \
            --user root \
            -w /zap/wrk \
            -v "$PWD/target/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8081 \
              -r zap-baseline.html \
              -x zap-baseline.xml \
              -J zap-baseline.json \
              -I

      - name: Show generated OWASP ZAP reports
        if: always()
        run: |
          echo "Generated ZAP report files:"
          find target/zap-reports -maxdepth 1 -type f -print -exec ls -lh {} \;

          if [ ! -f target/zap-reports/zap-baseline.html ] || \
             [ ! -f target/zap-reports/zap-baseline.xml ] || \
             [ ! -f target/zap-reports/zap-baseline.json ]; then
            echo "::warning::Expected ZAP HTML/XML/JSON reports were not all generated."
          fi

      - name: Upload OWASP ZAP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-zap-baseline-html
          path: ghostreport/target/zap-reports/zap-baseline.html
          if-no-files-found: warn

      - name: Upload OWASP ZAP JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-zap-baseline-json
          path: ghostreport/target/zap-reports/zap-baseline.json
          if-no-files-found: warn

      - name: Upload OWASP ZAP XML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-zap-baseline-xml
          path: ghostreport/target/zap-reports/zap-baseline.xml
          if-no-files-found: warn

      - name: Upload DAST application log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-ghostreport-app-log
          path: ghostreport/target/ghostreport-dast-app.log
          if-no-files-found: warn

      - name: Publish DAST evidence summary
        if: always()
        run: |
          {
            echo "## DAST - OWASP ZAP Baseline"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| ZAP HTML report | dast-zap-baseline-html |"
            echo "| ZAP JSON report | dast-zap-baseline-json |"
            echo "| ZAP XML report | dast-zap-baseline-xml |"
            echo "| Application runtime log | dast-ghostreport-app-log |"
            echo ""
            echo "GhostReport runs on the GitHub runner at http://localhost:8081; ZAP runs in Docker with host networking."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop GhostReport background process
        if: always()
        run: |
          if [ -f target/ghostreport-dast-app.pid ]; then
            kill "$(cat target/ghostreport-dast-app.pid)" || true
          fi
