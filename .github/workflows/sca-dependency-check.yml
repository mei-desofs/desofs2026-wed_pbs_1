# DevSecOps stage 02B.
# Evidence workflow: checks vulnerable dependencies and publishes reports for
# triage. It is non-blocking while the team validates CVEs and false positives.
name: 02B - SCA OWASP Dependency-Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage_02b_sca_dependency_check:
    name: Stage 02B - Dependency-Check SCA evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Prepare Java 17 and Maven dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      # Generate complete SCA reports for review without failing the build while
      # CVEs are being validated.
      - name: Run OWASP Dependency-Check SCA in evidence mode
        run: ./mvnw org.owasp:dependency-check-maven:12.1.0:check -Dformat=ALL -DossindexAnalyzerEnabled=false -DfailOnError=false -DfailBuildOnCVSS=11
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check HTML evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-sca-html
          path: ghostreport/target/dependency-check-report/dependency-check-report.html
          if-no-files-found: warn

      - name: Upload Dependency-Check JSON evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-sca-json
          path: ghostreport/target/dependency-check-report/dependency-check-report.json
          if-no-files-found: warn

      - name: Upload Dependency-Check XML evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-sca-xml
          path: ghostreport/target/dependency-check-report/dependency-check-report.xml
          if-no-files-found: warn

      - name: Upload Dependency-Check SARIF evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-sca-sarif
          path: ghostreport/target/dependency-check-report/dependency-check-report.sarif
          if-no-files-found: warn

      - name: Publish SCA evidence summary
        if: always()
        run: |
          {
            echo "## SCA - OWASP Dependency-Check"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| HTML report | dependency-check-sca-html |"
            echo "| JSON report | dependency-check-sca-json |"
            echo "| XML report | dependency-check-sca-xml |"
            echo "| SARIF report | dependency-check-sca-sarif |"
            echo "| Gate mode | Evidence review |"
            echo ""
            echo "Findings are reviewed with application context. OSS Index is disabled to avoid unrelated 401 failures."
          } >> "$GITHUB_STEP_SUMMARY"
