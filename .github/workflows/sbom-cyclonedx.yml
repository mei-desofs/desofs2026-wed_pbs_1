# DevSecOps stage 02D.
# Supply-chain evidence workflow: produces CycloneDX SBOM artifacts.
name: 02D - SBOM CycloneDX

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage_02d_sbom_cyclonedx:
    name: Stage 02D - Generate CycloneDX SBOM evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./ghostreport

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Prepare Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ghostreport/pom.xml

      - name: Generate CycloneDX SBOM
        run: ./mvnw -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Upload CycloneDX SBOM artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: |
            ghostreport/target/bom.json
            ghostreport/target/bom.xml
          if-no-files-found: error

      - name: Publish SBOM evidence summary
        if: always()
        run: |
          {
            echo "## SBOM - CycloneDX"
            echo ""
            echo "| Evidence | Artifact |"
            echo "| --- | --- |"
            echo "| CycloneDX JSON/XML SBOM | sbom-cyclonedx |"
            echo "| Gate mode | Evidence/manual triage |"
          } >> "$GITHUB_STEP_SUMMARY"

